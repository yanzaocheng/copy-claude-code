# The test suite on the three systems claude-pro runs on, with the oldest and the newest Node it supports.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Starts the whole program in a fake terminal: every module loads and the interface comes up.
      - run: npm run check
      - run: npm test
        env:
          # No test may reach a real account: these must not leak in from the runner.
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_AUTH_TOKEN: ''
