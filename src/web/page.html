<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claude-pro 控制台</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="brand-logo">c</div><strong>claude-pro</strong><span class="brand-tag">CONSOLE</span><span class="brand-ver" id="brandVersion"></span></div>
      <a class="side-new" href="#/new" data-nav="new"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>新会话</a>
      <div class="ws-head"><span>工作区</span><span class="ws-tools"><button type="button" id="wsSearchBtn" title="搜索会话"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><button type="button" id="wsRefresh" title="刷新"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button><a href="#/new" title="新会话"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a></span></div>
      <input type="search" class="ws-search hidden" id="wsSearch" placeholder="搜索会话或目录…">
      <div class="ws" id="ws"><div class="ws-empty">正在加载…</div></div>
      <!-- settings and the other pages: in the menu of the account, at the bottom -->
      <div class="user-menu hidden" id="userMenu">
        <nav class="side-nav" id="nav">
          <a href="#/providers" data-nav="providers"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>模型与供应商</a>
          <a href="#/extensions" data-nav="extensions"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3"/></svg>扩展</a>
          <a href="#/remote" data-nav="remote"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>远程访问</a>
          <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>设置</a>
          <div class="menu-sep"></div>
          <a href="#/overview" data-nav="overview"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>概览</a>
          <a href="#/sessions" data-nav="sessions"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>全部会话与回收站</a>
          <a href="#/memory" data-nav="memory"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>记忆与指令</a>
          <a href="#/usage" data-nav="usage"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M7 17V11M12 17V6M17 17v-4"/></svg>用量</a>
        </nav>
        <div class="remote-links hidden" id="remoteLinks"><a href="/__cp/computers">切换电脑</a><button type="button" id="logoutBtn">退出登录</button></div>
      </div>
      <div class="side-foot"><button type="button" class="side-me" id="sideMe" title="设置与更多" aria-haspopup="menu" aria-expanded="false"><span class="avatar" id="sideAvatar">·</span><span class="side-user" id="sideUser"></span><svg class="side-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button><button type="button" class="icon-btn" id="themeToggle" title="浅色 / 深色">◐</button></div>
    </aside>
    <button type="button" class="mobile-menu" id="menuBtn" aria-label="菜单">☰</button>
    <div class="side-backdrop" id="sideBackdrop"></div>
    <main class="main" id="main"><div class="page"><div class="empty">正在加载…</div></div></main>
  </div>
  <div class="tip hidden" id="tip"></div>
</body>
</html>
