<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<body>
  <div class="app">
    <aside class="side" id="sideDrawer">
      <div class="brand"><img class="brand-logo" src="/favicon.svg" alt="" width="28" height="28"><strong>claude-pro</strong><span class="brand-tag">CONSOLE</span><span class="brand-release"><span class="brand-ver" id="brandVersion"></span><button type="button" class="brand-update hidden" id="brandUpdate" aria-label="更新">↑</button></span><button type="button" class="icon-btn side-toggle" id="sideHide" title="收起侧栏（Ctrl+B）" aria-label="收起侧栏" aria-controls="sideDrawer" aria-expanded="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg></button></div>
      <a class="side-new" href="#/new" data-nav="new"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>新会话</a>

      <div class="ws" id="ws"><div class="ws-empty">正在加载…</div></div>

    <main class="main" id="main"><div class="page"><div class="empty">正在加载…</div></div></main>
