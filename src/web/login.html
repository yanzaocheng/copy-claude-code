<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex">
  <title>登录 · claude-pro 控制台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: light dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif; background: #f6f7f9; color: #111827; }
    main { width: min(430px, 100%); background: #fff; border: 1px solid #e3e6eb; border-radius: 16px; padding: 28px 24px 24px; box-shadow: 0 10px 34px rgba(0, 0, 0, .07); overflow-wrap: anywhere; }
    .logo { display: block; width: 44px; height: 44px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(194, 88, 54, .28); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 18px; color: #6b7280; font-size: 13.5px; }
    input[type=password] { width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid #cfd4dc; border-radius: 10px; font: inherit; background: transparent; color: inherit; outline: none; }
    input[type=password]:focus { border-color: #d97757; box-shadow: 0 0 0 3px rgba(217, 119, 87, .18); }
    label.remember { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: 13.5px; color: #374151; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #d97757; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; }
    .error { min-height: 20px; margin-top: 10px; color: #dc2626; font-size: 13.5px; }
    @media (max-width: 860px) {
      input[type=password] { font-size: 16px; }
      label.remember { min-height: 44px; margin: 4px 0 8px; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1115; color: #e5e7eb; }
      main { background: #171a21; border-color: #2a2f3a; }
      input[type=password] { border-color: #3a404d; }
      label.remember { color: #cbd0d8; }
      p { color: #9aa1ad; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/favicon.svg" alt="claude-pro" width="44" height="44">
    <h1>claude-pro 控制台</h1>
    <p>这是一台电脑上的 claude-pro。输入在 claude-pro 里设置的远程访问密码。</p>
    <form id="f">
      <input type="password" id="pw" placeholder="密码" autocomplete="current-password" autofocus required>
      <label class="remember"><input type="checkbox" id="remember" checked> 记住这台设备 30 天</label>
      <button type="submit" id="go">登录</button>
      <div class="error" id="err"></div>
    </form>
  </main>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const go = document.getElementById("go"), err = document.getElementById("err");
      go.disabled = true;
      err.textContent = "";
      try {
        const res = await fetch("/__login", { method: "POST", headers: { "content-type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ password: document.getElementById("pw").value, remember: document.getElementById("remember").checked }) });
        const data = await res.json().catch(() => ({}));
        if (res.ok) { location.replace("/"); return; }
        err.textContent = data.error || ("登录失败 (" + res.status + ")");
      } catch (ex) {
        err.textContent = "连不上：" + ex.message;
      } finally {
        go.disabled = false;
      }
    });
  </script>
</body>
</html>
